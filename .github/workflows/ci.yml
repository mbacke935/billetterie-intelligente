name: Node.js CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Configuration de Node.js 22
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      # 3. Installation des dépendances système Linux pour MongoDB
      - name: Installation des dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4 libssl-dev

      # 4. Installation des packages npm
      - name: Installation des dépendances npm
        working-directory: ./backend
        run: npm install

      # 5. Exécution des tests Jest
      - name: Exécution des tests backend
        working-directory: ./backend
        env:
          MONGOMS_VERSION: '6.0.6'
        run: npm test