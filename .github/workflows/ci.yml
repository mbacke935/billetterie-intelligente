name: Node.js CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    # Démarrage d'un vrai service MongoDB
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: ./backend

    steps:
      # 1. Récupération du code
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Configuration Node.js (Node 22)
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      # 3. Installation des dépendances npm
      - name: Installation des dépendances
        run: npm install

      # 4. Exécution des tests avec contournement complet du binaire mongodb-memory-server
      - name: Exécution des tests backend
        env:
          MONGOMS_SYSTEM_BINARY: /usr/bin/mongod
          MONGO_URI: mongodb://127.0.0.1:27017/testdb
        run: npm test