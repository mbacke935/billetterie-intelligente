name: CI Backend Billetterie

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ma_cle_secrete_jwt_2024
          MONGO_URI: mongodb://127.0.0.1:27017/billetterie_test