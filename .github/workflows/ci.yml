name: CI Billetterie Intelligente

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Tests - Service Utilisateurs (backend)
    runs-on: ubuntu-latest

    # Conservé de l'historique CI : les tests démarrent leur propre MongoDB via
    # mongodb-memory-server (voir backend/tests/*.test.js). MONGOMS_SYSTEM_BINARY
    # pointe vers le mongod fourni par ce service container, pour éviter que
    # mongodb-memory-server ne tente de télécharger son propre binaire.
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGOMS_SYSTEM_BINARY: /usr/bin/mongod
          MONGO_URI: mongodb://127.0.0.1:27017/testdb

  test-abonnements-service:
    name: Tests - Service Abonnements
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: billetterie_abonnements_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: abonnements-service
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: abonnements-service/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: billetterie_abonnements_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  test-billetterie-service:
    name: Tests - Service Billetterie
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billetterie_titres_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: billetterie-service
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: billetterie-service/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: billetterie_titres_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          QR_SECRET: ${{ secrets.QR_SECRET }}

  build-frontend:
    name: Build - Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le frontend
        run: npm run build
        env:
          # Non consommée par le code actuel (URLs codées en dur dans src/services/*.js),
          # conservée pour la conformité avec le TP et une future configuration par environnement.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
